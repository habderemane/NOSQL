# Labo S3 — Modélisation orientée requêtes : Redis, MongoDB, Cassandra et Neo4j (un nœud chacun)
# Démarrage : docker compose up -d   (dans le dossier labo-s3) — ou seulement les services utiles :
#             docker compose up -d redis mongo
name: s3-modelisation

services:
  redis:
    image: redis:7.4
    container_name: s3-redis
    ports:
      - "6380:6379"       # Redis Insight : localhost, port 6380
    volumes:
      - ./redis:/scripts:ro

  mongo:
    image: mongo:8.0
    container_name: s3-mongo
    hostname: s3-mongo
    # replica set d'un seul nœud : nécessaire aux flux de modifications (change streams)
    command: ["mongod", "--replSet", "rs-s3", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27317:27017"     # Compass : mongodb://localhost:27317/?directConnection=true
    volumes:
      - mongo-data:/data/db
      - ./mongo:/scripts:ro

  cassandra:
    image: cassandra:5.0
    container_name: s3-cassandra
    hostname: s3-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: "teranga-s3"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_DC: "dc_dakar"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_NUM_TOKENS: "16"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    ports:
      - "9043:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./cql:/cql:ro

  neo4j:
    image: neo4j:5.26
    container_name: s3-neo4j
    environment:
      NEO4J_AUTH: "neo4j/teranga2026"                   # utilisateur neo4j, mot de passe teranga2026
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    ports:
      - "7474:7474"       # navigateur : http://localhost:7474
      - "7687:7687"       # protocole Bolt
    volumes:
      - neo4j-data:/data
      - ./cypher:/scripts:ro

volumes:
  mongo-data:
  cassandra-data:
  neo4j-data:
